apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smart-manufacturing-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/KishorKumarParoi/smart-manufacturing.git
    targetRevision: production
    path: k8s/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: smart-manufacturing
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
