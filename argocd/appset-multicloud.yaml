apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: smart-manufacturing-multicloud
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - cluster: in-cluster
            url: https://kubernetes.default.svc
            cloud: aws
            region: us-east-1
            overlay: aws-primary
          - cluster: gcp-gke-failover
            url: https://gke-api.smartmfg.internal
            cloud: gcp
            region: us-central1
            overlay: gcp-failover
  template:
    metadata:
      name: 'smart-manufacturing-{{cloud}}-{{region}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/KishorKumarParoi/smart-manufacturing.git
        targetRevision: HEAD
        path: 'k8s/overlays/{{overlay}}'
      destination:
        server: '{{url}}'
        namespace: smart-manufacturing
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
