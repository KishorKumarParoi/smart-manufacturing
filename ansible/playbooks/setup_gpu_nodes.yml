---
- name: Setup and Validate NVIDIA GPU Nodes across Multi-Cloud Clusters
  hosts: gpu_workers
  gather_facts: yes
  become: yes
  tasks:
    - name: Verify operating system compatibility
      ansible.builtin.debug:
        msg: "Configuring node on {{ cloud_provider }} ({{ region }}) running {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Install prerequisite packages
      ansible.builtin.package:
        name:
          - curl
          - gnupg2
          - ca-certificates
        state: present

    - name: Setup NVIDIA Container Toolkit repository
      ansible.builtin.shell: |
        curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg --yes
        curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list | \
          sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' | \
          tee /etc/apt/sources.list.d/nvidia-container-toolkit.list
      when: ansible_os_family == 'Debian'

    - name: Install NVIDIA Container Toolkit
      ansible.builtin.package:
        name: nvidia-container-toolkit
        state: latest

    - name: Configure Containerd for NVIDIA GPU runtime
      ansible.builtin.shell: |
        nvidia-ctk runtime configure --runtime=containerd
        systemctl restart containerd

    - name: Verify NVIDIA drivers via nvidia-smi
      ansible.builtin.command: nvidia-smi
      register: nvidia_smi_output
      changed_when: false
      failed_when: false

    - name: Report GPU status
      ansible.builtin.debug:
        msg: "GPU Verification Result: {{ 'SUCCESS - GPU Detected' if nvidia_smi_output.rc == 0 else 'WARNING - Simulated/Emulated Environment' }}"
