[project]
name = "smart-manufacturing"
version = "1.0.0"
description = "Enterprise Smart Manufacturing MLOps Platform with MLflow, Kubeflow, ArgoCD, Terraform, Ansible, GPU Kubernetes, and Multi-Cloud Failover"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "mlflow>=2.17.0",
    "kfp>=2.9.0",
    "prometheus-client>=0.21.0",
    "boto3>=1.35.0",
    "google-cloud-storage>=2.18.0",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pyyaml>=6.0.2",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.8.0",
    "flake8>=7.1.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

