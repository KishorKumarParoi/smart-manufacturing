apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-manufacturing-api
  namespace: smart-manufacturing
  labels:
    app: smart-manufacturing-api
    tier: inference-engine
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: smart-manufacturing-api
  template:
    metadata:
      labels:
        app: smart-manufacturing-api
        tier: inference-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              preference:
                matchExpressions:
                  - key: accelerator
                    operator: In
                    values: ["nvidia-gpu", "nvidia-tesla-t4", "nvidia-a10g"]
            - weight: 20
              preference:
                matchExpressions:
                  - key: cloud.google.com/gke-nodepool
                    operator: In
                    values: ["system-pool", "production-core-pool"]
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "sku"
          operator: "Equal"
          value: "gpu"
          effect: "NoSchedule"
      containers:
        - name: inference-api
          image: kishorkumarparoi/smart-manufacturing:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: APP_ENV
              value: "production"
            - name: PORT
              value: "5000"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PRIMARY_CLOUD
              value: "gcp"
            - name: SECONDARY_CLOUD
              value: "aws"
            - name: REDIS_HOST
              value: "redis-service.smart-manufacturing.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "2Gi"
          startupProbe:
            httpGet:
              path: /api/health
              port: 5000
            failureThreshold: 18
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
