apiVersion: v1
kind: Service
metadata:
  name: smart-manufacturing-service
  namespace: smart-manufacturing
  labels:
    app: smart-manufacturing-api
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: 5000
      nodePort: 30080
    - name: http-8000
      port: 8000
      targetPort: 5000
      nodePort: 30081
  selector:
    app: smart-manufacturing-api
