apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - patch-pdb.yaml

patches:
  - path: patch-production.yaml
  - path: patch-ingress.yaml

namePrefix: prod-
labels:
  - includeSelectors: true
    pairs:
      environment: production
      cluster-provider: gcp-gke
      cluster-region: us-central1
      managed-by: argocd

