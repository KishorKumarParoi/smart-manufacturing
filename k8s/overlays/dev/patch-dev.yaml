apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-manufacturing-api
  namespace: smart-manufacturing-dev
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: inference-api
          image: kishorkumarparoi/smart-manufacturing:dev-latest
          imagePullPolicy: Always
          env:
            - name: APP_ENV
              value: "development"
            - name: LOG_LEVEL
              value: "DEBUG"
            - name: REDIS_HOST
              value: "redis-dev.smart-manufacturing-dev.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: PORT
              value: "8000"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
