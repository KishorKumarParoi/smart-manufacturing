apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-manufacturing-api
  namespace: smart-manufacturing-stage
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    spec:
      containers:
        - name: inference-api
          image: kishorkumarparoi/smart-manufacturing:stage-latest
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_ENV
              value: "staging"
            - name: REDIS_HOST
              value: "redis-stage.smart-manufacturing-stage.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: PORT
              value: "8000"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
