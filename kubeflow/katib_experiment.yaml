apiVersion: kubeflow.org/v1beta1
kind: Experiment
metadata:
  namespace: kubeflow
  name: smart-mfg-katib-tuning
spec:
  objective:
    type: minimize
    goal: 0.005
    objectiveMetricName: val_reconstruction_loss
  algorithm:
    algorithmName: bayesianoptimization
  parallelTrialCount: 2
  maxTrialCount: 8
  maxFailedTrialCount: 2
  parameters:
    - name: lr
      parameterType: double
      feasibleSpace:
        min: "0.0001"
        max: "0.01"
    - name: batch_size
      parameterType: int
      feasibleSpace:
        min: "16"
        max: "64"
    - name: latent_dim
      parameterType: int
      feasibleSpace:
        min: "2"
        max: "6"
  trialTemplate:
    primaryContainerName: training-container
    trialParameters:
      - name: learningRate
        description: Learning rate for Adam optimizer
        reference: lr
      - name: batchSize
        description: Batch size for training
        reference: batch_size
      - name: latentDim
        description: Latent bottleneck dimension
        reference: latent_dim
    trialSpec:
      apiVersion: batch/v1
      kind: Job
      spec:
        template:
          metadata:
            annotations:
              sidecar.istio.io/inject: "false"
          spec:
            containers:
              - name: training-container
                image: smartmfg/trainer-gpu:latest
                command:
                  - python
                  - -m
                  - src.training.train_sensor
                  - "--lr=${trialParameters.learningRate}"
                  - "--batch-size=${trialParameters.batchSize}"
                resources:
                  limits:
                    nvidia.com/gpu: 1
                    cpu: "2"
                    memory: "4Gi"
            restartPolicy: Never
