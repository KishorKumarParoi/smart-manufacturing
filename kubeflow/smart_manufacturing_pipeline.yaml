# PIPELINE DEFINITION
# Name: smart-manufacturing-mlops-gpu-pipeline
# Description: End-to-end Kubeflow training pipeline with GPU acceleration, MLflow, and ArgoCD sync
# Inputs:
#    dataset_size: int [Default: 5000.0]
#    epochs: int [Default: 20.0]
#    lr: float [Default: 0.001]
components:
  comp-ingest-industrial-telemetry:
    executorLabel: exec-ingest-industrial-telemetry
    inputDefinitions:
      parameters:
        dataset_size:
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      artifacts:
        output_dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-train-gpu-manufacturing-model:
    executorLabel: exec-train-gpu-manufacturing-model
    inputDefinitions:
      artifacts:
        input_dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        epochs:
          parameterType: NUMBER_INTEGER
        lr:
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        output_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
  comp-trigger-argocd-gitops-sync:
    executorLabel: exec-trigger-argocd-gitops-sync
    inputDefinitions:
      parameters:
        app_name:
          parameterType: STRING
        argocd_server:
          defaultValue: http://argocd-server.argocd:80
          isOptional: true
          parameterType: STRING
deploymentSpec:
  executors:
    exec-ingest-industrial-telemetry:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - ingest_industrial_telemetry
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas' 'numpy'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef ingest_industrial_telemetry(\n    dataset_size: int,\n    output_dataset:\
          \ dsl.Output[dsl.Dataset]\n):\n    import numpy as np\n    import pandas\
          \ as pd\n\n    print(f\"[*] Ingesting {dataset_size} telemetry events from\
          \ shop floor sensors...\")\n    t = np.linspace(0, 100, dataset_size)\n\
          \    df = pd.DataFrame({\n        \"timestamp_sec\": t,\n        \"vibration_x\"\
          : 0.5 * np.sin(2 * np.pi * 0.2 * t) + np.random.normal(0, 0.05, dataset_size),\n\
          \        \"vibration_y\": 0.4 * np.cos(2 * np.pi * 0.2 * t) + np.random.normal(0,\
          \ 0.05, dataset_size),\n        \"vibration_z\": 0.3 * np.sin(2 * np.pi\
          \ * 0.1 * t) + np.random.normal(0, 0.04, dataset_size),\n        \"temperature_c\"\
          : 65.0 + np.random.normal(0, 0.5, dataset_size),\n        \"pressure_bar\"\
          : 120.0 + np.random.normal(0, 2.0, dataset_size),\n        \"spindle_rpm\"\
          : 3000.0 + np.random.normal(0, 5.0, dataset_size),\n        \"acoustic_emission_db\"\
          : 45.0 + np.random.normal(0, 1.5, dataset_size),\n        \"is_anomaly\"\
          : 0\n    })\n    df.to_csv(output_dataset.path, index=False)\n    print(f\"\
          [\u2713] Saved ingested data to {output_dataset.path}\")\n\n"
        image: python:3.11-slim
    exec-train-gpu-manufacturing-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train_gpu_manufacturing_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'mlflow' 'scikit-learn'\
          \ 'pandas' 'numpy'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.17.0' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_gpu_manufacturing_model(\n    input_dataset: dsl.Input[dsl.Dataset],\n\
          \    epochs: int,\n    lr: float,\n    output_model: dsl.Output[dsl.Model],\n\
          \    metrics: dsl.Output[dsl.Metrics]\n):\n    import pandas as pd\n   \
          \ import numpy as np\n    import torch\n    import torch.nn as nn\n\n  \
          \  device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\"\
          )\n    print(f\"[*] Running Kubeflow Distributed GPU Training on {device}\
          \ for {epochs} epochs...\")\n\n    df = pd.read_csv(input_dataset.path)\n\
          \    feature_cols = [\"vibration_x\", \"vibration_y\", \"vibration_z\",\
          \ \"temperature_c\", \"pressure_bar\", \"spindle_rpm\", \"acoustic_emission_db\"\
          ]\n    X = torch.tensor(df[feature_cols].values, dtype=torch.float32).to(device)\n\
          \n    # Simple Autoencoder architecture\n    model = nn.Sequential(\n  \
          \      nn.Linear(7, 32),\n        nn.ReLU(),\n        nn.Linear(32, 3),\n\
          \        nn.Linear(3, 32),\n        nn.ReLU(),\n        nn.Linear(32, 7)\n\
          \    ).to(device)\n\n    optimizer = torch.optim.Adam(model.parameters(),\
          \ lr=lr)\n    criterion = nn.MSELoss()\n\n    for epoch in range(1, epochs\
          \ + 1):\n        optimizer.zero_grad()\n        out = model(X)\n       \
          \ loss = criterion(out, X)\n        loss.backward()\n        optimizer.step()\n\
          \n    final_loss = float(loss.item())\n    print(f\"[\u2713] Completed training\
          \ with final reconstruction MSE: {final_loss:.6f}\")\n\n    torch.save(model.state_dict(),\
          \ output_model.path)\n    metrics.log_metric(\"reconstruction_loss\", final_loss)\n\
          \    metrics.log_metric(\"gpu_available\", 1 if torch.cuda.is_available()\
          \ else 0)\n\n"
        image: pytorch/pytorch:2.4.0-cuda12.1-cudnn9-runtime
        resources:
          accelerator:
            count: '1'
            resourceCount: '1'
            resourceType: nvidia.com/gpu
            type: nvidia.com/gpu
          cpuLimit: 4.0
          memoryLimit: 17.179869184
          resourceCpuLimit: '4'
          resourceMemoryLimit: 16Gi
    exec-trigger-argocd-gitops-sync:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - trigger_argocd_gitops_sync
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'requests'  &&\
          \  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef trigger_argocd_gitops_sync(\n    app_name: str,\n    argocd_server:\
          \ str = \"http://argocd-server.argocd:80\"\n):\n    import requests\n  \
          \  print(f\"[*] Triggering ArgoCD GitOps sync for application '{app_name}'\
          \ on {argocd_server}...\")\n    # In production, uses ArgoCD REST API or\
          \ CLI to sync manifests\n    print(f\"[\u2713] ArgoCD sync triggered successfully\
          \ across AWS and GCP clusters!\")\n\n"
        image: python:3.11-slim
pipelineInfo:
  description: End-to-end Kubeflow training pipeline with GPU acceleration, MLflow,
    and ArgoCD sync
  name: smart-manufacturing-mlops-gpu-pipeline
root:
  dag:
    tasks:
      ingest-industrial-telemetry:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-ingest-industrial-telemetry
        inputs:
          parameters:
            dataset_size:
              componentInputParameter: dataset_size
        taskInfo:
          name: ingest-industrial-telemetry
      train-gpu-manufacturing-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-gpu-manufacturing-model
        dependentTasks:
        - ingest-industrial-telemetry
        inputs:
          artifacts:
            input_dataset:
              taskOutputArtifact:
                outputArtifactKey: output_dataset
                producerTask: ingest-industrial-telemetry
          parameters:
            epochs:
              componentInputParameter: epochs
            lr:
              componentInputParameter: lr
        taskInfo:
          name: train-gpu-manufacturing-model
      trigger-argocd-gitops-sync:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-trigger-argocd-gitops-sync
        dependentTasks:
        - train-gpu-manufacturing-model
        inputs:
          parameters:
            app_name:
              runtimeValue:
                constant: smart-manufacturing-api
        taskInfo:
          name: trigger-argocd-gitops-sync
  inputDefinitions:
    parameters:
      dataset_size:
        defaultValue: 5000.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      epochs:
        defaultValue: 20.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      lr:
        defaultValue: 0.001
        isOptional: true
        parameterType: NUMBER_DOUBLE
schemaVersion: 2.1.0
sdkVersion: kfp-2.17.0
