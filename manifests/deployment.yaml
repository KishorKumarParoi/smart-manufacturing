apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-manufacturing
  labels:
    app: smart-manufacturing
    tier: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smart-manufacturing
  template:
    metadata:
      labels:
        app: smart-manufacturing
        tier: api
    spec:
      containers:
      - name: smart-manufacturing
        image: kishorkumarparoi/smart-manufacturing:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5000
        env:
        - name: PORT
          value: "5000"
        - name: FLASK_DEBUG
          value: "0"
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1500Mi
        # Startup probe: give the app 3 min to load ML model on first start
        startupProbe:
          httpGet:
            path: /api/health
            port: 5000
          failureThreshold: 18
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3