services:
  # 1. Next.js 15+ Industrial Cockpit & Operator Dashboard
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: smart-mfg-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - GATEWAY_URL=http://gateway-go:8085
      - PORT=3000
    depends_on:
      - gateway-go
    restart: unless-stopped

  # 2. Go Cloud-Native Gateway & Multi-Cloud Health Controller
  gateway-go:
    build:
      context: ../services/telemetry-gateway-go
      dockerfile: Dockerfile
    container_name: smart-mfg-gateway-go
    ports:
      - "8085:8085"
    environment:
      - PORT=8085
      - PRIMARY_API_URL=http://api-primary:8000
      - SECONDARY_API_URL=http://api-secondary:8000
      - EDGE_INGEST_URL=http://ingest-rust:8082
    depends_on:
      - api-primary
      - api-secondary
      - ingest-rust
    restart: unless-stopped

  # 3. Rust Edge Ingestion Service (Low-Latency SIMD Ingestion & Pre-filter)
  ingest-rust:
    build:
      context: ../services/edge-ingestion-rust
      dockerfile: Dockerfile
    container_name: smart-mfg-ingest-rust
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RUST_LOG=info
    depends_on:
      - redis
    restart: unless-stopped

  # 4. Redis 7.2 In-Memory Telemetry Buffer & Prediction Cache
  redis:
    image: redis:7.2-alpine
    container_name: smart-mfg-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # 5. Primary AI Inference Engine (PyTorch Autoencoder + CNN, AWS us-east-1)
  api-primary:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: smart-mfg-api-aws-primary
    ports:
      - "8000:8000"
    environment:
      APP_ENV: staging
      PRIMARY_CLOUD: aws
      CURRENT_CLOUD: aws
      CURRENT_REGION: us-east-1
      DEVICE: cpu
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      - redis
      - mlflow
    restart: unless-stopped

  # 6. Standby AI Inference Engine (PyTorch Autoencoder + CNN, GCP us-central1)
  api-secondary:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: smart-mfg-api-gcp-failover
    ports:
      - "8001:8000"
    environment:
      APP_ENV: staging
      PRIMARY_CLOUD: aws
      CURRENT_CLOUD: gcp
      CURRENT_REGION: us-central1
      DEVICE: cpu
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      - redis
      - mlflow
    restart: unless-stopped

  # 7. MinIO (S3-compatible local artifact store for MLflow)
  minio:
    image: minio/minio:latest
    container_name: smart-mfg-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # 8. MLflow Model Registry & Experiment Tracking
  mlflow:
    build:
      context: ..
      dockerfile: mlflow/Dockerfile
    container_name: smart-mfg-mlflow
    ports:
      - "5000:5000"
    environment:
      BACKEND_STORE_URI: sqlite:////mlflow/mlflow.db
      ARTIFACT_ROOT: s3://smart-mfg-mlops-artifacts-us-east-1/mlflow
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadminpassword
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      - minio
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped

volumes:
  minio_data:
  mlflow_data:
